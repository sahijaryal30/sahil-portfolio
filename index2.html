<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>All Projects – Sahil Thakur</title>
    <style>
         :root {
            --bg: #111214;
            --card: #2a2b2f;
            --line: #2b2d31;
            --text: #fff;
            --muted: #9a9ca3;
            --accent: #a6e83a;
            --max: 1180px;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
            line-height: 1.5;
        }
        
        a {
            color: inherit;
            text-decoration: none;
        }
        
        .wrap {
            max-width: var(--max);
            margin: 0 auto;
            padding: 0 24px;
        }
        /* NAVBAR */
        
        header {
            border-bottom: 1px solid var(--line);
        }
        
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
        }
        
        .logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: .3px;
        }
        
        .crumbs {
            color: var(--accent);
            font-size: 14px;
            text-transform: uppercase;
        }
        
        .crumbs a:hover {
            text-decoration: underline;
        }
        /* PAGE */
        
        main {
            padding: 36px 0 72px;
        }
        
        h1 {
            font-size: clamp(26px, 3.4vw, 34px);
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .sub {
            color: var(--muted);
            font-size: 15px;
            margin-bottom: 28px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 270px));
            justify-content: space-between;
            gap: 32px 20px;
        }
        
        .thumb {
            position: relative;
            aspect-ratio: 9 / 16;
            background: var(--card);
            border-radius: 16px;
            overflow: hidden;
            display: grid;
            place-items: center;
            transition: transform .25s;
        }
        
        .project:hover .thumb {
            transform: translateY(-4px);
        }
        
        .thumb img,
        .thumb video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .play {
            position: relative;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--accent);
            display: grid;
            place-items: center;
        }
        
        .play::before {
            content: "";
            border-left: 13px solid #111;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            margin-left: 3px;
        }
        
        .project h4 {
            font-size: 16px;
            margin-top: 12px;
        }
        
        a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }
        
        @media (max-width: 900px) {
            .grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
        
        @media (max-width: 560px) {
            .grid {
                grid-template-columns: minmax(0, 320px);
                justify-content: center;
            }
            .crumbs {
                font-size: 12px;
            }
        }
    </style>
</head>
